[workspace]
members = [".", "crates/*"]
exclude = ["vendor"]

# Bevy Solari with a fix for a crash compacting ray-tracing BLAS (see vendor/README.md).
[patch.crates-io]
bevy_solari = { path = "vendor/bevy_solari" }
dlss_wgpu = { path = "vendor/dlss_wgpu" }

[package]
name = "portal-runner"
version = "0.1.0"
edition = "2024"

[dependencies]
# (Under `dlss`: Ray Reconstruction's model preset, set before DLSS starts. Vendored, see
# vendor/dlss_wgpu.)
dlss_wgpu = { version = "4", optional = true }
faith_move = { path = "crates/faith_move" }
me_assets = { path = "crates/me_assets" }
faith_anim = { path = "crates/faith_anim" }
aperture = { path = "crates/aperture" }
bevy = { version = "0.19.1", default-features = false, features = ["3d", "ui", "audio", "wav", "mp3", "png", "bevy_solari"] }
half = "2"
# Mirror's Edge's materials remastered (src/me_remaster.rs): its table, and its detail sets'
# JPEGs.
serde = { version = "1", features = ["derive"] }
ron = "0.12"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
# ...and their maps compressed for the GPU (BC1/BC3/BC5): five times smaller than RGBA.
texpresso = { version = "2", features = ["rayon"] }
bevy_egui = { version = "0.42", default-features = false, features = ["render", "default_fonts"] }

# Fast-ish dev builds: optimize dependencies, keep our code debuggable.
[features]
# NVIDIA DLSS (RTX GPUs, Vulkan), on by default: needs NVIDIA's DLSS SDK at build time
# (DLSS_SDK=<its folder>; see https://github.com/bevyengine/dlss_wgpu). Without the SDK, build
# with `--no-default-features`. On a GPU without DLSS the game falls back either way.
default = ["dlss"]
dlss = ["bevy/dlss", "dep:dlss_wgpu"]
# The Mirror's Edge prologue map, drawn and playable from your install (FAITH_MAP=prologue).
# Not part of the public source.
prologue = ["me_assets/prologue"]

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
